spring.application.name=museo-api
server.port=8080
# Escucha en todas las interfaces para que el emulador (10.0.2.2) o un teléfono en la misma red puedan conectarse
server.address=0.0.0.0

spring.datasource.url=jdbc:h2:mem:museodb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.default-property-inclusion=non_null
