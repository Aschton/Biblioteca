spring.application.name=ms-pedidos
server.port=8083
# Escucha en todas las interfaces para que el emulador (10.0.2.2) o un teléfono en la misma red puedan conectarse
server.address=0.0.0.0

# ---- MySQL ----
# La base museo_pedidos se crea sola la primera vez (createDatabaseIfNotExist=true).
# Usuario/clave por defecto de XAMPP: root sin clave. Para cambiarlos sin tocar el código, en cmd:
#   set DB_USER=miusuario
#   set DB_PASSWORD=miclave
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/museo_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Si MySQL se apaga, responder en 3 s en vez de quedarse esperando 30 s (valor por defecto)
spring.datasource.hikari.connection-timeout=3000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.default-property-inclusion=non_null

# ---- Comunicación con otro microservicio ----
# ms-pedidos consulta precios y descuenta stock en ms-catalogo
catalogo.url=${CATALOGO_URL:http://localhost:8082}
